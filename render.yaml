# Render Blueprint — one client's two environments, from one repo:
#   starbase-staging    deploys every push to `main`     → test here first
#   starbase            deploys the `production` branch  → promoted from main
#                       by the "Promote to production" workflow (GitHub → Actions)
# Each has its own Postgres database; nothing is shared between them.
#
# Another client is another copy of this file's pair with its own names
# (starbase-<client>, starbase-<client>-staging) and its own STARBASE_* values —
# see GOING-LIVE.md "A new client". Service names are unique per Render
# account, so the copy must rename every service and database.
#
# Docs: https://render.com/docs/blueprint-spec
#
# Every outside service, its settings and where each key comes from:
# INTEGRATIONS.md. Settings with sync: false are asked for when the Blueprint
# is created and set per service after. Optional ones, added under the
# service's Environment only when wanted:
#   RESEND_WEBHOOK_SECRET, RESEND_REGION                email: bounces and complaints back; where Add domain makes the domain
#   MAIL_PROVIDER, SENDGRID_API_KEY, SENDGRID_WEBHOOK_PUBLIC_KEY   email through SendGrid instead of Resend
#   MAILCHIMP_API_KEY, MAILCHIMP_AUDIENCE_ID, MAILCHIMP_WEBHOOK_SECRET   Mailchimp: a list out as a tag, unsubscribes back
#   GEOCODER (bc), GEOCODER_FALLBACK, BC_GEOCODER_KEY   map pins (google is no longer used for pins)
#   GOOGLE_MAPS_TILES=off, GOOGLE_MAPS_TILE_TYPE        Google is the map whenever its key is set; =off keeps
#                                                       the free map. Before this goes to staging, tell us Google
#                                                       or the free map for canvassing. With a key already set,
#                                                       Google becomes the map and phones stop keeping street
#                                                       maps offline. Set GOOGLE_MAPS_TILES=off to keep the free map.
#   GOOGLE_TILES_DAILY_MAX                              Google tiles a day, then the free map until midnight
#   ADDRESS_SUGGEST                                     google: Google's address suggestions (only after counsel's yes)
#   GOOGLE_PLACES_DAILY_MAX, GOOGLE_PLACES_PER_PERSON   Google asks a day (300) and per person (50)
#   STARBASE_TILE_URL, _ATTRIBUTION, _MAX_ZOOM          another tile provider
#   STARBASE_TILE_PROVIDER (stadia), STARBASE_TILE_KEY  a tile provider by name (and its key)
#   TWILIO_VOICE=off                                    texting without calls
#   CALLHUB_API_KEY, CALLHUB_API_BASE                   the phone dialer (CallHub): call lists out, results back
#   STARBASE_CANDIDATES, STARBASE_PROVINCE, STARBASE_GEO_BOUNDS   the campaign
#   APP_HOSTS                                           the app's other addresses, never the website's
# Once set: Settings → Services in the admin checks each one.

services:
  - type: web
    name: starbase-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STARBASE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: starbase-staging-db
          property: connectionString
      # Staging starts in base.win's own look with a made-up campaign name, so
      # it can be shown to anyone (server/lib/brand.js; a brand a manager saves
      # in Settings → Brand wins over it). The rules below — limits,
      # time zone, city, slates — are the client's, so staging tests what
      # production does.
      - key: STARBASE_BRAND
        value: base
      - key: STARBASE_ORG_NAME
        value: Demo Campaign
      - key: STARBASE_JURISDICTION
        value: bc-municipal
      - key: STARBASE_TZ
        value: America/Vancouver
      - key: STARBASE_CITY
        value: Surrey
      - key: STARBASE_SLATES
        value: "council:City council,school_board:School board"
      - key: STARBASE_PUBLIC_URL     # this environment's address, e.g. https://starbase-staging.onrender.com
        sync: false
      - key: RESEND_API_KEY          # email: newsletters, invites, shift alerts (staging: a test key, or unset)
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID      # texting and calls (staging: a test number, or unset)
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY  # optional: Google map tiles and (when ADDRESS_SUGGEST=google) address suggestions (INTEGRATIONS.md)
        sync: false

  - type: web
    name: starbase
    runtime: docker
    plan: starter              # always-on; volunteers canvass at all hours
    region: oregon
    branch: production
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STARBASE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: starbase-db
          property: connectionString
      # The client: it starts in Imagine Surrey's own look (Surrey Navy,
      # marigold, its wordmark); a brand a manager saves in Settings → Brand wins.
      - key: STARBASE_BRAND
        value: imagine-surrey
      - key: STARBASE_ORG_NAME
        value: Imagine Surrey
      - key: STARBASE_JURISDICTION
        value: bc-municipal
      - key: STARBASE_TZ
        value: America/Vancouver
      - key: STARBASE_CITY
        value: Surrey
      - key: STARBASE_SLATES
        value: "council:City council,school_board:School board"
      - key: STARBASE_PUBLIC_URL     # the public address, e.g. https://starbase.imaginesurrey.ca
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM               # e.g. Imagine Surrey <team@imaginesurrey.ca>
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false

databases:
  - name: starbase-staging-db
    plan: 0.5c-1g              # 0.5 CPU, 1 GB RAM ($19/month); upgraded Nov 2026 for speed
    region: oregon
    postgresMajorVersion: "16"
  - name: starbase-db
    plan: 0.5c-1g              # 0.5 CPU, 1 GB RAM ($19/month); upgraded Nov 2026 for speed
    region: oregon
    postgresMajorVersion: "16"
