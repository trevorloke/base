name: CI

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  starbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test (event log, cap engine, API)
        run: npm test
      - name: Test over the Postgres wire protocol (DATABASE_URL adapter)
        run: npm run test:pg
      # The control centre (ops.base.win) deploys from main whatever changed:
      # it borrows server/lib, shared/ and web/src/app.css and the root
      # dependencies, so its tests run on every change, not only on its paths.
      - name: Test the control centre (apps/platform)
        run: npm run test:platform
      - name: Build (web)
        run: npm run build
