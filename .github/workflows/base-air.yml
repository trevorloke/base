name: Base Air

# Starsign (apps/air): its own checks, run only when it changes. Base
# Ground's CI (ci.yml) is what promote.yml waits on.
on:
  push:
    branches: [main]
    paths: ['apps/air/**', '.github/workflows/base-air.yml']
  pull_request:
    paths: ['apps/air/**', '.github/workflows/base-air.yml']

jobs:
  air:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/air
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/air/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @starsign/web typecheck
      - run: pnpm test
      - run: pnpm --filter @starsign/web build
