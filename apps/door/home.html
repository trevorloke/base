<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>base.win</title>
<meta name="description" content="Base is software for social engagement. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout idea: a left-aligned wordmark sitting on a ground line. */
  :root {
    --paper: #f3f5f7;
    --ink: #10233b;
    --muted: #5a6b7f;
    --line: #c9d2dc;
    --signal: #e2502a;
      --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0d1a2b;
      --ink: #eef2f6;
      --muted: #9aabbd;
      --line: #2a3c52;
      --signal: #ff6a3d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0d1a2b;
    --ink: #eef2f6;
    --muted: #9aabbd;
    --line: #2a3c52;
    --signal: #ff6a3d;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .wrap {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 clamp(20px, 5vw, 56px);
  }
  header.wrap {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    padding-top: 28px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }
  .status { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
  .status::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--signal);
  }
  main.wrap {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: clamp(32px, 6vw, 88px);
    align-items: end;
    padding-top: clamp(48px, 10vh, 120px);
    padding-bottom: clamp(40px, 8vh, 88px);
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(88px, 19vw, 224px);
    line-height: 0.82;
    letter-spacing: -0.045em;
    margin: 0;
    padding-bottom: 0.1em;
    border-bottom: 6px solid var(--signal);
  }
  .lede {
    font-size: clamp(19px, 2.2vw, 24px);
    line-height: 1.35;
    max-width: 24ch;
    margin: 28px 0 0;
    text-wrap: balance;
  }
  footer.wrap {
    padding-top: 20px;
    padding-bottom: 28px;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }
  @media (max-width: 720px) {
    main.wrap { grid-template-columns: 1fr; align-items: start; }
  }
</style>
</head>
<body>
  <header class="wrap">
    <span>base.win</span>
    <span class="status">Coming soon</span>
  </header>

  <!-- The product can be mounted here later: replace or extend this <main> (served by door.mjs at /). -->
  <main class="wrap" id="app">
    <div>
      <h1>Base</h1>
      <p class="lede">Software for social engagement. We're building it now.</p>
    </div>
  </main>

  <footer class="wrap">
    <span>&copy; 2026 Base</span>
  </footer>
</body>
</html>
