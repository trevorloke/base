# One check per app. "Promote to production" waits for all four to pass on
# the commit it moves production to.
name: CI

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  ground:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ground/package-lock.json
      - run: npm ci
      - name: Test (event log, cap engine, API)
        run: npm test
      - name: Test over the Postgres wire protocol (DATABASE_URL adapter)
        run: npm run test:pg
      - name: Build (web)
        run: npm run build

  web:
    runs-on: ubuntu-latest
    # A real Postgres, so the tests that read and write the database run too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: base_web_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/base_web_test
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Migrate the test database
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm test
      - run: npm run build

  air:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/air
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/air/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @base-air/web typecheck
      - run: pnpm test
      - run: pnpm --filter @base-air/web build

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
