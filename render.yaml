# Render Blueprint for Base (SUITE.md). One client today: Imagine Surrey
# (slug `imaginesurrey`). Every client has its own copy of each app — its own
# services, its own databases and its own subdomain; only the front door is
# shared.
#
#   *-staging    deploys every push to `main`        → <client>.staging.base.win
#   the rest     deploys the `production` branch     → <client>.base.win, moved forward
#                only by "Promote to production" (GitHub → Actions), when Trevor
#                says so
#
# Production today is base ground alone (still named `starbase`, on its old
# settings). Its rename and production's web, air and front door are written
# out at the bottom, commented, and go in at the first promotion of the suite:
# the `production` branch doesn't hold apps/web, apps/air or apps/gateway until
# then, so a service built from it now would fail.
#
# Base Ground and Base Air are private services (`pserv`): no public address,
# so everything reaches them through the front door. Base Web is public: it
# serves the client's own domain.
#
# A new client is a copy of the `imaginesurrey` blocks under its own slug
# (names are unique per Render workspace) plus BASE_CLIENT_<SLUG>_* lines on
# the front door. See SUITE.md.
#
# Settings with `sync: false` are asked for when the Blueprint syncs and are
# set per service after. Each app's own docs list its optional settings:
# apps/ground/INTEGRATIONS.md, apps/web/SETUP.md, apps/air/README.md.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── The front door ──────────────────────────────────────────────────────
  - type: web
    name: base-gateway-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerContext: ./apps/gateway
    dockerfilePath: ./apps/gateway/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    # Custom domains (added in the dashboard, with DNS at GoDaddy):
    # staging.base.win and *.staging.base.win
    envVars:
      - key: BASE_HOST
        value: staging.base.win
      - key: BASE_CLIENT_IMAGINESURREY_GROUND
        fromService: { type: pserv, name: base-ground-imaginesurrey-staging, property: hostport }
      - key: BASE_CLIENT_IMAGINESURREY_AIR
        fromService: { type: pserv, name: base-air-imaginesurrey-staging, property: hostport }
      - key: BASE_CLIENT_IMAGINESURREY_WEB   # Base Web staging's public https:// address
        sync: false

  # ── Imagine Surrey · Base Ground (staging) ──────────────────────────────
  - type: pserv
    name: base-ground-imaginesurrey-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile          # Base Ground's image, at the root (see the Dockerfile)
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase: { name: base-ground-imaginesurrey-staging-db, property: connectionString }
      - key: BASE_PUBLIC_URL
        value: https://imaginesurrey.staging.base.win
      - key: BASE_CLIENT                   # the slug Base Air and Base Web link accounts under
        value: imaginesurrey
      - key: BASE_TRUSTED_PROXIES          # Render's load balancer, then the front door
        value: "2"
      - key: BASE_ORG_NAME
        value: Imagine Surrey
      - key: BASE_JURISDICTION
        value: bc-municipal
      - key: BASE_TZ
        value: America/Vancouver
      - key: BASE_CITY
        value: Surrey
      - key: BASE_SLATES
        value: "council:City council,school_board:School board"
      # Signing in once (SUITE.md): ground is the hub; each app's secret is
      # made here and handed to that app below.
      - key: BASE_AIR_URL
        value: https://imaginesurrey.staging.base.win/air
      - key: BASE_AIR_SSO_SECRET
        generateValue: true
      - key: BASE_WEB_URL                  # Base Web staging's public https:// address
        sync: false
      - key: BASE_WEB_SSO_SECRET
        generateValue: true
      - key: RESEND_API_KEY                # staging: a test key, or unset
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID            # staging: a test number, or unset
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false

  # ── Imagine Surrey · Base Web (staging) ─────────────────────────────────
  - type: web
    name: base-web-imaginesurrey-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerContext: ./apps/web
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: base-web-imaginesurrey-staging-db, property: connectionString }
      - key: NEXT_PUBLIC_SITE_URL          # this service's public https:// address (built into the pages)
        sync: false
      - key: BASE_WEB_CLIENT               # Imagine Surrey's copy, places and look; built into the pages
        value: imagine-surrey
      - key: BASE_WEB_JURISDICTION
        value: bc
      - key: BASE_WEB_BRAND_PRESET
        value: imagine-surrey
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_EMAIL                   # the first owner
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_GROUND_URL
        value: https://imaginesurrey.staging.base.win
      - key: BASE_GROUND_INTERNAL_URL
        fromService: { type: pserv, name: base-ground-imaginesurrey-staging, property: hostport }
      - key: BASE_SSO_SECRET
        fromService: { type: pserv, name: base-ground-imaginesurrey-staging, envVarKey: BASE_WEB_SSO_SECRET }
      - key: BASE_AIR_URL
        value: https://imaginesurrey.staging.base.win/air
      - key: BASE_GROUND_KEY               # a website key made in Base Ground (Settings → Services)
        sync: false
      - key: BASE_GROUND_INBOUND_KEY
        sync: false
      - key: STRIPE_SECRET_KEY             # staging: test-mode keys only
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL                  # image uploads (Supabase Storage); required on Render
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

  - type: cron
    name: base-web-imaginesurrey-staging-reminders
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: ./apps/web
    schedule: "7 17 * * *"                 # about 10 a.m. Pacific
    buildCommand: echo "nothing to build"
    startCommand: node scripts/cron.mjs reminders
    envVars:
      - key: BASE_WEB_INTERNAL_URL
        fromService: { type: web, name: base-web-imaginesurrey-staging, property: hostport }
      - key: CRON_SECRET
        fromService: { type: web, name: base-web-imaginesurrey-staging, envVarKey: CRON_SECRET }

  - type: cron
    name: base-web-imaginesurrey-staging-email
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: ./apps/web
    schedule: "37 17 * * *"
    buildCommand: echo "nothing to build"
    startCommand: node scripts/cron.mjs email
    envVars:
      - key: BASE_WEB_INTERNAL_URL
        fromService: { type: web, name: base-web-imaginesurrey-staging, property: hostport }
      - key: CRON_SECRET
        fromService: { type: web, name: base-web-imaginesurrey-staging, envVarKey: CRON_SECRET }

  # ── Imagine Surrey · Base Air (staging) ─────────────────────────────────
  # One image, three services: the API (which serves the web app), the
  # workers (publishing queue, ingest, schedules) and the operators (agents).
  - type: pserv
    name: base-air-imaginesurrey-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerContext: ./apps/air
    dockerfilePath: ./apps/air/Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: base-air-imaginesurrey-staging-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: base-air-imaginesurrey-staging-redis, property: connectionString }
      - key: BASE_PATH
        value: /air
      - key: BASE_AIR_PUBLIC_URL
        value: https://imaginesurrey.staging.base.win/air
      - key: BASE_AIR_MASTER_KEY
        generateValue: true
      - key: BASE_AIR_BRAND_PRESET
        value: air
      - key: BASE_GROUND_URL
        value: https://imaginesurrey.staging.base.win
      - key: BASE_GROUND_INTERNAL_URL
        fromService: { type: pserv, name: base-ground-imaginesurrey-staging, property: hostport }
      - key: BASE_SSO_SECRET
        fromService: { type: pserv, name: base-ground-imaginesurrey-staging, envVarKey: BASE_AIR_SSO_SECRET }
      - key: BASE_WEB_URL                  # Base Web staging's public https:// address
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
  - type: worker
    name: base-air-imaginesurrey-staging-workers
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerContext: ./apps/air
    dockerfilePath: ./apps/air/Dockerfile
    dockerCommand: node --import tsx /app/apps/workers/src/main.ts
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: base-air-imaginesurrey-staging-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: base-air-imaginesurrey-staging-redis, property: connectionString }
      - key: BASE_AIR_PUBLIC_URL
        value: https://imaginesurrey.staging.base.win/air
      - key: BASE_AIR_MASTER_KEY
        fromService: { type: pserv, name: base-air-imaginesurrey-staging, envVarKey: BASE_AIR_MASTER_KEY }
  - type: worker
    name: base-air-imaginesurrey-staging-operators
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerContext: ./apps/air
    dockerfilePath: ./apps/air/Dockerfile
    dockerCommand: node --import tsx /app/apps/operators/src/main.ts
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: base-air-imaginesurrey-staging-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: base-air-imaginesurrey-staging-redis, property: connectionString }
      - key: BASE_AIR_PUBLIC_URL
        value: https://imaginesurrey.staging.base.win/air
      - key: BASE_AIR_MASTER_KEY
        fromService: { type: pserv, name: base-air-imaginesurrey-staging, envVarKey: BASE_AIR_MASTER_KEY }
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BASE_AIR_MODEL
        value: claude-opus-5-5
  - type: keyvalue
    name: base-air-imaginesurrey-staging-redis
    plan: starter
    region: oregon
    ipAllowList: []                        # private network only

  # ── Imagine Surrey · Base Ground (production) ───────────────────────────
  # Still named `starbase` and on its old settings until the first promotion
  # of the suite. The BASE_* settings below are added beside the old
  # STARBASE_* ones (a Blueprint never deletes a setting), so the code
  # promoted later finds them; the STARBASE_* ones are removed after.
  - type: web
    name: starbase
    runtime: docker
    plan: starter              # always-on; volunteers canvass at all hours
    region: oregon
    branch: production
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STARBASE_ENV
        value: production
      - key: BASE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: starbase-db, property: connectionString }
      - key: STARBASE_ORG_NAME
        value: Imagine Surrey
      - key: BASE_ORG_NAME
        value: Imagine Surrey
      - key: STARBASE_JURISDICTION
        value: bc-municipal
      - key: BASE_JURISDICTION
        value: bc-municipal
      - key: STARBASE_TZ
        value: America/Vancouver
      - key: BASE_TZ
        value: America/Vancouver
      - key: STARBASE_CITY
        value: Surrey
      - key: BASE_CITY
        value: Surrey
      - key: STARBASE_SLATES
        value: "council:City council,school_board:School board"
      - key: BASE_SLATES
        value: "council:City council,school_board:School board"

databases:
  - name: base-ground-imaginesurrey-staging-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
  - name: base-web-imaginesurrey-staging-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
  - name: base-air-imaginesurrey-staging-db   # pgvector: CREATE EXTENSION vector (air's first migration)
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
  - name: starbase-db                          # production ground; renamed at the first promotion
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

# ── At the first promotion of the suite ─────────────────────────────────────
# Production follows staging's blocks above with `branch: production`, the
# names without `-staging`, and base.win in place of staging.base.win:
#   base-gateway                      the front door: BASE_HOST=base.win, domains base.win and *.base.win
#   base-ground-imaginesurrey         a new private service (a public service can't become private) on
#                                     production's existing database, renamed in place from `starbase-db` to
#                                     `base-ground-imaginesurrey-db`: same data, nothing copied.
#                                     BASE_PUBLIC_URL=https://imaginesurrey.base.win, BASE_TRUSTED_PROXIES=2,
#                                     the SSO settings; no STARBASE_* lines. The old public `starbase` service is
#                                     suspended once imaginesurrey.base.win answers, then removed.
#   base-web-imaginesurrey (+ its two crons) on imaginesurrey.ca, using the website's existing database
#                                     (`imagine-surrey-db`, renamed in place), replacing the old
#                                     ImagineSurreyWebsite service
#   base-air-imaginesurrey (+ workers, operators, redis, db)
