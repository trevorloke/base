# Render Blueprint — base.win's three environments, from one repo (GOING-LIVE.md §0):
#   Staging     base-win-staging, every push to `main` → https://staging.base.win
#               the sample campaign and the public demo; nobody real is on it
#   Production  one service per client, from the `production` branch, which
#               "Promote to production" (GitHub → Actions) moves up from main.
#               Imagine Surrey: base-win → https://imaginesurrey.base.win
#   Admin       base-platform, the control centre → https://ops.base.win
# The front page, https://base.win, is apps/front/index.html: a static site set
# up by hand in Render (not in this file), from `main`; it frames staging's demo.
# Each service has its own Postgres database; nothing is shared between them.
#
# Another client is made with the control centre: ops.base.win → New campaign
# walks Render through one production service and its database
# (base-win-<name>, base-win-<name>-db), served at its own address,
# https://<name>.base.win, a custom domain on that service — see GOING-LIVE.md
# §6 "A new client". The fallback: the same page of the control centre writes
# that client's own block for this file (its names, its STARBASE_* values and
# STARBASE_BRAND=base). Never copy base-win's block below: it is Imagine
# Surrey's, and its STARBASE_BRAND line turns on Imagine Surrey's own set-up.
#
# Docs: https://render.com/docs/blueprint-spec
#
# Every outside service, its settings and where each key comes from:
# INTEGRATIONS.md. Settings with sync: false are asked for when the Blueprint
# is created and set per service after. Optional ones, added under the
# service's Environment only when wanted:
#   RESEND_WEBHOOK_SECRET, RESEND_REGION                email: bounces and complaints back; where Add domain makes the domain
#   MAIL_PROVIDER, SENDGRID_API_KEY, SENDGRID_WEBHOOK_PUBLIC_KEY   email through SendGrid instead of Resend
#   MAILCHIMP_API_KEY, MAILCHIMP_AUDIENCE_ID, MAILCHIMP_WEBHOOK_SECRET   Mailchimp: a list out as a tag, unsubscribes back
#   STARBASE_WEBSITE_URL, STARBASE_WEBSITE_KEY          unsubscribes sent to the campaign's own website, when it is hosted
#                                                       apart; set by hand on that one service, never listed below
#   GEOCODER (bc), GEOCODER_FALLBACK, BC_GEOCODER_KEY   map pins (google is no longer used for pins)
#   GOOGLE_TRANSLATE_KEY                                the website in Punjabi and Chinese: Google Cloud
#                                                       Translation, a separate key restricted to it (asked
#                                                       for below); GOOGLE_TRANSLATE_API_BASE is for tests only
#   GOOGLE_MAPS_TILES=off, GOOGLE_MAPS_TILE_TYPE        Google is the map whenever its key is set; =off keeps
#                                                       the free map. Before this goes to staging, tell us Google
#                                                       or the free map for canvassing. With a key already set,
#                                                       Google becomes the map and phones stop keeping street
#                                                       maps offline. Set GOOGLE_MAPS_TILES=off to keep the free map.
#   GOOGLE_TILES_DAILY_MAX                              Google tiles a day, then the free map until midnight
#   ADDRESS_SUGGEST                                     google: Google's address suggestions (only after counsel's yes)
#   GOOGLE_PLACES_DAILY_MAX, GOOGLE_PLACES_PER_PERSON   Google asks a day (300) and per person (50)
#   STARBASE_TILE_URL, _ATTRIBUTION, _MAX_ZOOM          another tile provider
#   STARBASE_TILE_PROVIDER (stadia), STARBASE_TILE_KEY  a tile provider by name (and its key)
#   STARBASE_TILE_CARTO_KEY  CARTO's free basemap key: the Clean look only with it
#   STARBASE_TILE_CLEAN      off: never offer CARTO (the free map behind Google stays)
#   TWILIO_VOICE=off                                    texting without calls
#   GMAIL_DAILY_MAX                                     emails a person may send from their Gmail in 24 h (100)
#   CALLHUB_API_KEY, CALLHUB_API_BASE                   the phone dialer (CallHub): call lists out, results back
#   STARBASE_CANDIDATES, STARBASE_PROVINCE, STARBASE_GEO_BOUNDS   the campaign
#   APP_HOSTS                                           the app's other addresses, never the website's
#   BASE_PLATFORM_PUBKEY (listed below, sync: false)    the control centre's public key (ops.base.win → base.win’s key):
#                                                       lets it open this desk; pasted, never committed
#   STARBASE_OWN_URL                                    this server's own address, only when RENDER_EXTERNAL_URL is
#                                                       missing or wrong (https://<service>.onrender.com)
# Once set: Settings → Services in the admin checks each one.

services:
  - type: web
    name: base-win-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STARBASE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: base-win-staging-db
          property: connectionString
      # Staging is a sample campaign in Vancouver: base.win's own look, a
      # made-up name and no client's brand, so it can be shown to anyone (server/lib/brand.js; a brand a manager saves
      # in Settings → Brand wins over it). The rules below — limits,
      # time zone, slates — are the ones a B.C. municipal client runs under,
      # so staging tests what production does.
      # Staging is the public demo: anyone can open it and is signed in as
      # the sample campaign's manager. So its email and texting keys are test
      # keys or unset, never a client's, and it never holds a real list.
      # Its map and translation keys are base.win's own, with a daily ceiling
      # set (GOOGLE_TILES_DAILY_MAX, GOOGLE_PLACES_DAILY_MAX), or unset:
      # never a client's (GOING-LIVE.md §0).
      - key: STARBASE_BRAND
        value: base
      - key: STARBASE_ORG_NAME
        value: Sample Campaign
      - key: STARBASE_JURISDICTION
        value: bc-municipal
      - key: STARBASE_TZ
        value: America/Vancouver
      - key: STARBASE_CITY
        value: Vancouver
      - key: STARBASE_GEO_BOUNDS     # the City of Vancouver: where the map opens and addresses are looked for
        value: "49.198,-123.225|49.317,-123.023"
      - key: STARBASE_SLATES
        value: "council:City council,school_board:School board"
      - key: STARBASE_PUBLIC_URL     # this environment's address: https://staging.base.win
        sync: false
      # The public demo (server/lib/demo.js; staging only): the base.win
      # website may frame this server, and /api/auth/demo signs a visitor in
      # as the account named, with no password. Off until the email is set.
      - key: STARBASE_FRAME_HOSTS
        value: "https://base.win,https://www.base.win"
      - key: STARBASE_DEMO_EMAIL     # the demo account, the sample campaign's manager (an address on a domain you hold)
        value: demo@base.win
      # The sample campaign (server/lib/samplecampaign.js; staging only):
      # everyone and everything in it is made up. It is made when the
      # database holds no campaign, and made again by itself when a release
      # carries a newer SAMPLE_VERSION (only while the database's one
      # campaign is the demo account's). STARBASE_SAMPLE_RESET is the
      # by-hand override: a word of your own choosing, which nobody issues
      # and which is not a secret; a word this database hasn't seen drops
      # everything in staging's database first.
      - key: STARBASE_SAMPLE
        value: vancouver
      - key: STARBASE_SAMPLE_RESET
        sync: false
      - key: STARBASE_CANDIDATES     # made-up opponents and made-up elector organizations for the sample's rating scale (server/lib/samplecast.js)
        value: "4A:Avendrel:Opposed — Lantern Quay Electors / Tamsin Avendrel;4B:Brindlemoor:Opposed — Juniper Bridge Alliance / Odell Brindlemoor;4C:Castramont:Opposed — Foghorn Civic League / Mireille Castramont"
      - key: RESEND_API_KEY          # email: newsletters, invites, shift alerts (staging is public: a test key or unset, never a client's; the daily staging check fails on a live one)
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID      # texting and calls (staging is public: test credentials or unset, never a client's; the daily staging check fails on live ones)
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY  # optional: Google map tiles and (when ADDRESS_SUGGEST=google) address suggestions (INTEGRATIONS.md). Staging is public: base.win's own key with GOOGLE_TILES_DAILY_MAX and GOOGLE_PLACES_DAILY_MAX set, or unset, never a client's
        sync: false
      - key: GOOGLE_TRANSLATE_KEY  # optional: the website in Punjabi and Chinese (Cloud Translation only; INTEGRATIONS.md). Staging is public: base.win's own key or unset, never a client's
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID  # optional: Sign in with Google and Google connections (INTEGRATIONS.md); staging's own client
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN_KEY  # 32+ random characters, a different one per environment
        sync: false
      - key: GOOGLE_PICKER_KEY  # optional: Google Drive and Sheets — a browser key limited to this site, docs.google.com and the Picker API (GOING-LIVE §7)
        sync: false
      - key: GOOGLE_CLOUD_PROJECT_NUMBER  # the project number (digits) of the project holding the OAuth client
        sync: false
      - key: BASE_PLATFORM_PUBKEY    # the control centre's public key (ops.base.win → base.win’s key); paste it, never commit it
        sync: false

  - type: web
    name: base-win
    runtime: docker
    plan: starter              # always-on; volunteers canvass at all hours
    region: oregon
    branch: production
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STARBASE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: base-win-db
          property: connectionString
      # The client. This one line turns on Imagine Surrey's own set-up
      # (server/presets/imagine-surrey): its look, its opponents and city, its
      # profile fields, its membership, its website and its sample people. It
      # must stay on this service and be on no other: every other campaign is
      # STARBASE_BRAND=base. A brand a manager saves in Settings → Brand
      # still wins for the look.
      - key: STARBASE_BRAND
        value: imagine-surrey
      - key: STARBASE_ORG_NAME
        value: Imagine Surrey
      - key: STARBASE_JURISDICTION
        value: bc-municipal
      - key: STARBASE_TZ
        value: America/Vancouver
      - key: STARBASE_CITY
        value: Surrey
      - key: STARBASE_SLATES
        value: "council:City council,school_board:School board"
      - key: STARBASE_PUBLIC_URL     # the public address: https://imaginesurrey.base.win
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM               # e.g. Imagine Surrey <team@imaginesurrey.ca>
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: GOOGLE_TRANSLATE_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN_KEY
        sync: false
      - key: GOOGLE_PICKER_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT_NUMBER
        sync: false
      - key: BASE_PLATFORM_PUBKEY    # the control centre's public key (ops.base.win → base.win’s key); paste it, never commit it
        sync: false

  # base.win's control centre (apps/platform), the admin environment: one
  # sign-in for every campaign. Its own address (https://ops.base.win) and its
  # own database. It never holds a campaign's database address or a Render key.
  # Branch: main until production has been promoted past the control centre's
  # release; then production, so the control centre goes through Promote like
  # everything else.
  - type: web
    name: base-platform
    runtime: node
    plan: starter
    region: oregon
    branch: main                  # see the note above: production, once production holds the control centre's release
    buildCommand: npm ci --omit=dev
    startCommand: node apps/platform/server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION            # Render's native Node: the same 22 as CI and the Dockerfile
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: base-platform-db
          property: connectionString
      - key: OPS_HOST
        value: ops.base.win
      - key: OPS_SETUP_CODE          # copy once to set up; press Generate to reopen setup (apps/platform/README)
        generateValue: true
      - key: OPS_SECRET              # seals the authenticator key; changing it means setting up again
        generateValue: true
      - key: PLATFORM_SIGNING_KEY    # opens campaign desks; its public half is each campaign's BASE_PLATFORM_PUBKEY
        generateValue: true

databases:
  - name: base-win-staging-db
    plan: basic-1gb            # 0.5 CPU, 1 GB RAM ($19/month); upgraded Nov 2026 for speed
    region: oregon
    postgresMajorVersion: "16"
  - name: base-win-db
    plan: basic-1gb            # 0.5 CPU, 1 GB RAM ($19/month); upgraded Nov 2026 for speed
    region: oregon
    postgresMajorVersion: "16"
  - name: base-platform-db
    plan: basic-256mb           # the smallest; it holds no people
    region: oregon
    postgresMajorVersion: "16"
