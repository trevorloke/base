<html lang="en-CA">

     page's own forms, which the Origin check refuses. same-origin still

<title>base.win’s key · base.win control centre</title>
<link rel="stylesheet" href="/app.css">

<body class="oc-body">
<header class="oc-top">
  <a class="oc-brand" href="/">base.win control centre</a>
  <nav class="oc-nav" aria-label="Control centre">

    <a href="/log">Log</a>

<main class="oc-main">
<section class="card oc-narrow oc-keypage"><h1>base.win’s key</h1>
  
  <p>Paste this as BASE_PLATFORM_PUBKEY on each campaign’s service in Render, then Save and deploy.</p>
    <div class="oc-copy">

    </div>
    <div class="oc-copy">
      <p class="oc-help">Its value</p>
      <pre class="oc-pre" id="key-value">mkRxeAO03eN7KrA3GBLERx3eKJOHcBJVSdPoSj8hKiU</pre>
      <button class="btn btn-primary oc-wide" type="button" data-copy="key-value">Copy</button>

  </section>
</main>

</html>
